# Place this file in .github/workflows/grandstrategy-debug.yml
# on YOUR FORK OF THE UNCIV ENGINE, after committing engine_patch/ to that fork.
name: Grand Strategy Android Debug APK
on:
  workflow_dispatch:
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply Grand Strategy patch
        run: python3 engine_patch/apply_to_unciv.py .
      - name: Build debug APK
        run: ./gradlew :android:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: grandstrategy-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
